AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GitHub Actions to AWS identity for my-app. Registers GitHub as an OIDC
  identity provider and creates the role the deploy pipeline assumes.
  Deployed once from a local machine; everything else is deployed by the pipeline.

Parameters:
  GitHubOwner:
    Type: String
    Default: srini313131
  GitHubOwnerId:
    Type: String
    Default: '52782561'
    Description: Numeric GitHub account ID. Unlike the name, it never changes or gets reused.
  GitHubRepo:
    Type: String
    Default: react-app-for-github-actions
  GitHubRepoId:
    Type: String
    Default: '1416544802'
    Description: Numeric GitHub repository ID.
  Branch:
    Type: String
    Default: main
    Description: Only workflow runs on this branch may assume the role.

Resources:
  # Tells this AWS account to accept tokens signed by GitHub Actions.
  # An account can hold only one provider per issuer URL.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # Stage 1-3 role, trusted by branch main. Still used by the pipeline on main
  # until the per-environment workflow is merged; then removed.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: my-app-github-deploy
      Description: Assumed by GitHub Actions to deploy my-app
      MaxSessionDuration: 3600
      # Trust policy: WHO may assume this role.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # aud: the token was issued for AWS STS, not some other service.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # sub: the run comes from this repository and this branch.
                # GitHub includes the numeric owner and repository IDs after each
                # name, so a deleted and re-registered name cannot match.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${Branch}
      # Permissions policy: WHAT the role may do once assumed.
      Policies:
        - PolicyName: deploy-my-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSiteStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/my-app-staging/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/my-app-prod/*
              - Sid: ReadTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: ManageSiteBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::my-app-staging-*
                  - !Sub arn:${AWS::Partition}:s3:::my-app-prod-*
              - Sid: PublishSiteFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::my-app-staging-*/*
                  - !Sub arn:${AWS::Partition}:s3:::my-app-prod-*/*
              # CloudFront IDs are generated at creation, so these actions
              # cannot be limited to a resource name in advance.
              - Sid: ManageCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'

  # Assumed only by jobs running in the GitHub Environment "staging", and
  # limited to the staging stack and bucket.
  StagingDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: my-app-deploy-staging
      Description: Assumed by GitHub Actions to deploy my-app staging
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # A job that names a GitHub Environment gets "environment:<name>"
                # here instead of the branch.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:staging
      Policies:
        - PolicyName: deploy-my-app-staging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSiteStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/my-app-staging/*
              - Sid: ReadTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: ManageSiteBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource: !Sub arn:${AWS::Partition}:s3:::my-app-staging-*
              - Sid: PublishSiteFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::my-app-staging-*/*
              # CloudFront IDs are generated at creation, so these actions
              # cannot be limited to one environment's distribution in advance.
              # This is the one permission the two roles share.
              - Sid: ManageCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'

  # Assumed only by jobs running in the GitHub Environment "prod", and
  # limited to the prod stack and bucket.
  ProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: my-app-deploy-prod
      Description: Assumed by GitHub Actions to deploy my-app prod
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # A job that names a GitHub Environment gets "environment:<name>"
                # here instead of the branch.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:environment:prod
      Policies:
        - PolicyName: deploy-my-app-prod
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageSiteStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:GetTemplate
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/my-app-prod/*
              - Sid: ReadTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: ManageSiteBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:GetBucketOwnershipControls
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                Resource: !Sub arn:${AWS::Partition}:s3:::my-app-prod-*
              - Sid: PublishSiteFiles
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::my-app-prod-*/*
              # CloudFront IDs are generated at creation, so these actions
              # cannot be limited to one environment's distribution in advance.
              # This is the one permission the two roles share.
              - Sid: ManageCloudFront
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:CreateResponseHeadersPolicy
                  - cloudfront:UpdateResponseHeadersPolicy
                  - cloudfront:DeleteResponseHeadersPolicy
                  - cloudfront:GetResponseHeadersPolicy
                  - cloudfront:GetCachePolicy
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'

Outputs:
  DeployRoleArn:
    Description: Set this as the AWS_ROLE_ARN repository variable in GitHub
    Value: !GetAtt DeployRole.Arn
  StagingDeployRoleArn:
    Description: Set this as AWS_ROLE_ARN in the GitHub Environment "staging"
    Value: !GetAtt StagingDeployRole.Arn
  ProdDeployRoleArn:
    Description: Set this as AWS_ROLE_ARN in the GitHub Environment "prod"
    Value: !GetAtt ProdDeployRole.Arn
  OidcProviderArn:
    Value: !Ref GitHubOidcProvider
