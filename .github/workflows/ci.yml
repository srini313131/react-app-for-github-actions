name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer pull request run replaces an older one. Runs on main are never
# cancelled: a deploy must not be cut off halfway through a stack update.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Staging deploys automatically. Prod deploys the same artifact after
  # staging succeeds, and waits for approval (set on the "prod" environment).
  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write # a called workflow only gets what its caller grants
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging

  deploy-prod:
    needs: deploy-staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
